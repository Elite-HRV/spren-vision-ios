group 'com.spren.spren_flutter'
version '1.0.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        maven {
            name = 'snapshots'
            url = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
        }
        maven {
            name = 'Central Portal Snapshots'
            url = 'https://central.sonatype.com/repository/maven-snapshots/'

            // Only search this repository for the specific dependency
            content {
                includeModule("com.spren", "sprencore")
                includeModule("com.spren", "sprencapture")
                includeModule("com.spren", "sprenui")
            }
        }
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 35
    namespace 'com.spren.spren_flutter'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion 28
    }
}

dependencies {
    implementation("com.spren:sprencore:2.0.8")
    implementation("com.spren:sprencapture:2.0.9")
    def camerax_version = "1.5.1"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation 'com.google.code.gson:gson:2.9.0'
}
